# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
    adapter: postgresql
    encoding: unicode
    max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    host: <%= ENV.fetch("POSTGRES_HOST") %>
    port: <%= ENV.fetch("POSTGRES_PORT") %>
    username: <%= ENV.fetch("POSTGRES_USER") %>
    password: <%= ENV.fetch("POSTGRES_PASSWORD") %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB_DEVELOPMENT") %>

test:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB_TEST") %>
    
production:
    primary: &primary_production
        <<: *default
        database: mini_payroll_production
        username: mini_payroll
        password: <%= ENV["MINI_PAYROLL_DATABASE_PASSWORD"] %>
    cache:
        <<: *primary_production
        database: mini_payroll_production_cache
        migrations_paths: db/cache_migrate
    queue:
        <<: *primary_production
        database: mini_payroll_production_queue
        migrations_paths: db/queue_migrate
    cable:
        <<: *primary_production
        database: mini_payroll_production_cable
        migrations_paths: db/cable_migrate
