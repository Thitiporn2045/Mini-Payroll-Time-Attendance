services:
    db:
        image: postgres:17-alpine
        container_name: mini_payroll_and_attendance_db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB_DEVELOPMENT}
        ports:
            - "${POSTGRES_PORT}:5432"
        volumes:
            - mini_payroll_postgres_data:/var/lib/postgresql/data

volumes:
    mini_payroll_postgres_data:
